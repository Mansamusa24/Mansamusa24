<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Riding Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #ui {
      display: flex;
      gap: 32px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }
    #ui span { color: #f0d080; }
    canvas {
      border: 3px solid #f0d080;
      border-radius: 8px;
      display: block;
    }
    #controls {
      margin-top: 12px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      border: 2px solid #f0d080;
      border-radius: 12px;
      padding: 32px 48px;
      text-align: center;
      z-index: 10;
    }
    #overlay h1 { font-size: 36px; color: #f0d080; margin-bottom: 8px; }
    #overlay p  { font-size: 16px; color: #ccc; margin-bottom: 20px; }
    #overlay button {
      background: #f0d080;
      border: none;
      color: #1a1a2e;
      font-size: 18px;
      font-weight: bold;
      padding: 10px 30px;
      border-radius: 8px;
      cursor: pointer;
    }
    #overlay button:hover { background: #ffe066; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Speed: <span id="speed">1x</span></div>
  </div>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div id="controls">
    SPACE / Up Arrow — Jump &nbsp;|&nbsp; Down Arrow — Duck &nbsp;|&nbsp; Avoid obstacles &amp; collect coins!
  </div>

  <div id="overlay">
    <h1>🐴 Horse Rider</h1>
    <p>Jump over logs, duck under branches,<br>collect coins, and ride as far as you can!</p>
    <button id="startBtn">Start Riding!</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
